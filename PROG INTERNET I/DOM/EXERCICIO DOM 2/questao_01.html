<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Erro no Nome</title>
    <style>
      .oculto {
        display: none;
      }

      .mensagem-erro {
        color: red;
        margin-top: 10px;
        font-weight: bold;
      }

      button {
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <h2>Validação de Nome</h2>

    <button onclick="exibirErro('erroNome', 'O nome é obrigatório!')">
      Mostrar Erro
    </button>

    <div id="erroNome" class="oculto mensagem-erro"></div>

    <script>
      function exibirErro(idElemento, mensagem) {
        const elemento = document.getElementById(idElemento);

        if (!elemento) {
          console.error(`Elemento com id "${idElemento}" não encontrado.`);
          return;
        }

        elemento.textContent = mensagem;
        elemento.classList.remove("oculto");

        setTimeout(() => {
          elemento.classList.add("oculto");
        }, 3000);
      }
    </script>
  </body>
</html>
